name: linux-smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KIWOOM_DATA_DIR: ${{ github.workspace }}/.runtime/data
      KIWOOM_LOG_DIR: ${{ github.workspace }}/.runtime/logs
      KIWOOM_BACKUP_BASE_DIR: ${{ github.workspace }}/.runtime/backups
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
