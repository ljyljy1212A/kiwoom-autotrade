version: "3.9"

services:
  autotrade:
    build: .
    container_name: kiwoom-autotrade
    restart: unless-stopped          # 장애 시 자동 재시작 (복구 로직)
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data             # SQLite dedup DB, heartbeat 등 영속화
      - ./config:/app/config:ro
    networks:
      - autotrade-net
    healthcheck:
      test: ["CMD", "python", "-c", "import time,os,sys; p='/app/data/heartbeat.txt'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<180 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # 계좌별로 완전히 분리된 컨테이너를 원할 경우(다계좌 격리 배포 예시)
  # id는 config/accounts.yaml 에 정의된 계좌 id와 일치해야 합니다 (예: us_real/us_mock/kr_real/kr_mock).
  autotrade-kr-mock:
    build: .
    container_name: kiwoom-autotrade-kr-mock
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ACCOUNT_FILTER=kr_mock        # main.py 가 이 값이 있으면 해당 계좌만 구동
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config:ro
    networks:
      - autotrade-net
    profiles: ["multi-account"]        # docker compose --profile multi-account up 시에만 실행

networks:
  autotrade-net:
    driver: bridge
