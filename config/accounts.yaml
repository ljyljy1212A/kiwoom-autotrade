# 다계좌 운영 설정
# 코드는 1벌이지만, 계좌별로 상태(state)/로그/설정/토큰이 완전히 분리됩니다.
# env_prefix 로 지정된 접두사의 환경변수를 .env 에서 읽어옵니다.
#
# 실계좌/모의투자는 앱키·시크릿부터 완전히 다른 값을 발급받아야 합니다.
# 키움 개발자센터에서 "모의투자" 앱키와 "실전투자" 앱키를 각각 별도로 발급받아
# 계좌별 env_prefix 에 맞는 환경변수(.env)에 넣어주세요. mode 값과 실제 앱키 종류가
# 어긋나면(mock 앱키로 mode: real 등) 토큰 발급 단계에서 인증 오류가 발생합니다.

accounts:
  # 예시 1) 해외주식(US) 실계좌
  - id: us_real
    display_name: "해외주식 실계좌 (SOXL 무한매수)"
    env_prefix: ACCOUNT_A          # ACCOUNT_A_NO / ACCOUNT_A_APPKEY / ACCOUNT_A_SECRETKEY (실전투자 앱키)
    market: US                     # US | KR
    exchange: ND                   # US: ND(나스닥)/NY(뉴욕)/NA(아멕스). market=KR인 경우 무시
    mode: real                     # real | mock  (계좌별 override, 미지정 시 KIWOOM_ENV 사용)
    strategy_config: config/strategy_config.example.json
    log_file: logs/us_real.log

  # 예시 2) 해외주식(US) 모의투자 — 실전 투입 전 최소 2주 검증 권장
  - id: us_mock
    display_name: "해외주식 모의투자 (SOXL 무한매수)"
    env_prefix: ACCOUNT_B          # 모의투자 전용 앱키 사용
    market: US
    exchange: NA                   # SOXL is listed on NYSE Arca
    mode: mock
    strategy_config: config/strategy_config.example.json
    log_file: logs/us_mock.log

  # 예시 3) 국내주식(KRX) 실계좌
  - id: kr_real
    display_name: "국내주식 실계좌 (삼성전자 무한매수)"
    env_prefix: ACCOUNT_C          # ACCOUNT_C_NO / ACCOUNT_C_APPKEY / ACCOUNT_C_SECRETKEY (실전투자 앱키)
    market: KR                     # KR
    exchange: "KRX"                 # 국내: KRX(코스피/코스닥 통합) | NXT(넥스트레이드) | SOR(최선주문집행)
    mode: real
    strategy_config: config/strategy_config_kr.example.json
    log_file: logs/kr_real.log

  # 예시 4) 국내주식(KRX) 모의투자 — 실전 투입 전 최소 2주 검증 권장
  - id: kr_mock
    display_name: "국내주식 모의투자 (삼성전자 무한매수)"
    env_prefix: ACCOUNT_D          # 모의투자 전용 앱키 사용
    market: KR
    exchange: "KRX"
    mode: mock
    strategy_config: config/strategy_config_kr.example.json
    log_file: logs/kr_mock.log

operators:
  - chat_id: 8648973973
    label: "Johon"

# 운영 시에는 위 4개를 모두 켜둘 필요는 없습니다. main.py 실행 시 환경변수 ACCOUNT_FILTER=kr_mock 처럼
# id 하나만 지정하면 해당 계좌만 구동됩니다(docker-compose.yml 의 서비스 분리 참고).
